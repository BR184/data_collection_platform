server:
  port: 0

spring:
  main:
    banner-mode: off
  datasource:
    url: ${TEST_DATASOURCE_URL:jdbc:postgresql://localhost:15433/qaflex?currentSchema=qaflex_test,public}
    username: ${TEST_DATASOURCE_USERNAME:qaflex}
    password: ${TEST_DATASOURCE_PASSWORD:change_this_password}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: qaflex_test
    default-schema: qaflex_test
    create-schemas: true
    clean-disabled: false

mybatis-plus:
  global-config:
    banner: false

logging:
  level:
    root: warn
    com.data.collection.platform: warn
    org.springframework: warn
    org.flywaydb: warn
    com.zaxxer.hikari: warn

platform:
  background-jobs:
    enabled: false
  auth:
    provider: local
    admin-username: ${TEST_PLATFORM_ADMIN_USERNAME:admin}
    admin-password: ${TEST_PLATFORM_ADMIN_PASSWORD:admin-test-2026}
    approval-username: ${TEST_PLATFORM_APPROVAL_USERNAME:approval}
    approval-password: ${TEST_PLATFORM_APPROVAL_PASSWORD:approval-test-2026}
    secure-config-required: false
  gitlab-mirror:
    scheduler-enabled: false
    web-base-url: ${TEST_GITLAB_WEB_BASE_URL:http://gitlab.test.local:18080}
