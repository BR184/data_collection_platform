    path: /api/label-groups/{groupId}
    category: READ
    ignore-paths:
      - "$.data.createdAt"
      - "$.data.updatedAt"
      - "$.data.members[*].createdAt"
      - "$.data.members[*].updatedAt"
    cases:
      - id: first-group
        query: groupId={{groupId}}
  - method: GET
    path: /api/label-groups/dimensions
    category: READ
    cases:
      - id: default
