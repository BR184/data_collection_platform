# 黄金基线端点目录
#
# 每个端点必须登记且仅登记一次（key = METHOD + path，与反射枚举逐字一致）。
# category: READ|OPTIONS|EXPORT|WRITE|EXCLUDED；EXCLUDED 必须给 exclude-reason。
# READ/OPTIONS/EXPORT 必须至少一个 case；EXPORT 必须 response: excel。
# case query 不含前导问号；POST 只读预览类用 body 传 JSON 请求体。
# {{configId}} 为运行期占位符（golden 套件注入的同步配置 id）。
#
# 排除理由约定：
# - async-trigger: 异步触发同步/刷新/重建任务的端点，链路本身由 bootstrap 全链路同步自证
#   （SUCCESS 终态 + ODS/事实行数断言），重复触发状态翻转与时长成本高。
# - external-dependency: 依赖 golden 档不可达的外部活体（GitLab Web API、MySQL/Mongo 老平台）。
# - session: 会话管理端点，是 golden 登录的前置依赖而非被测对象，由 spring-security-test 层覆盖。
# - destructive: 破坏性或外部副作用操作。
# - empty-runtime-config: 端点依赖的运行期配置数据在 golden 库恒为空态（无迁移种子），
#   请求确定性失败且无法在隔离环境中构造稳定输入；由写用例阶段评估补覆盖。
#
# 用例参数约定：
# - query 中的 {{configId}}/{{recordId}}/{{catalogId}}/{{groupId}} 为运行期变量，
#   golden 套件启动时从库内真实数据解析注入。
# - 与路径变量 {name} 同名的 query 键会先替换进路径再从查询串移除（如 sourceKey/fieldKey）。
# 路径空间约定：READ/OPTIONS/EXPORT 的响应树即 ApiResponse，ignore-paths 用 $.data.*；
# WRITE 的响应快照为 {"httpStatus":N,"body":{...ApiResponse}} 包装（400 校验拒绝同为契约），
# ignore-paths 一律用 $.body.*。
endpoints:
  # =====HomeController=====
  - method: GET
    path: /
    category: READ
    cases:
      - id: default

  # =====AuthController（会话管理）=====
  - method: GET
    path: /api/auth/current
    category: EXCLUDED
    exclude-reason: "session: 会话态端点，golden 登录流程的前置依赖；由 spring-security-test 层覆盖"
  - method: POST
    path: /api/auth/login
    category: EXCLUDED
    exclude-reason: "session: 会话管理端点，golden 套件登录步骤已真实执行；响应为会话建立而非业务数据"
  - method: POST
    path: /api/auth/logout
    category: EXCLUDED
    exclude-reason: "session: 会话销毁端点，非业务数据产出"

  # =====StatisticBoardController（统计看板）=====
  - method: GET
    path: /api/statistic-boards/{boardKey}
    category: READ
    ignore-paths: ["$.data.meta.generatedAt", "$.data.meta.queryDurationMs"]
    # 筛选选项来自 DISTINCT 聚合，无 ORDER BY，集合内顺序跨运行不稳定（集合本身恒定）
    ignore-array-order: ["$.data.definition.filters[*].options"]
    cases:
      - id: system-test-defect-summary
        query: boardKey=system-test-defect-summary
      - id: system-test-defect-cause
        query: boardKey=system-test-defect-cause
      - id: system-test-delay-analysis
        query: boardKey=system-test-delay-analysis
      - id: system-test-phase-statistics
        query: boardKey=system-test-phase-statistics
      - id: customer-issue-defect-summary
        query: boardKey=customer-issue-defect-summary
      - id: customer-issue-defect-cause
        query: boardKey=customer-issue-defect-cause
      - id: customer-issue-delay-issues
        query: boardKey=customer-issue-delay-issues
      - id: customer-issue-by-function
        query: boardKey=customer-issue-by-function
      - id: customer-issue-response-efficiency
        query: boardKey=customer-issue-response-efficiency
      # mirror-table-overview 未登记在 PagePermissionKeyResolver.BOARD_VIEW（任何环境确定性 400
      # "统计页面权限未定义"），无页面数据产出，不构成数据基线用例。
  - method: GET
    path: /api/statistic-boards/{boardKey}/details
    category: READ
    ignore-paths: ["$.data.meta.generatedAt", "$.data.meta.queryDurationMs"]
    cases:
      - id: system-test-defect-summary-total
        query: boardKey=system-test-defect-summary&rowKey=__total__&columnKey=level1_total
  - method: GET
    path: /api/statistic-boards/{boardKey}/rule-explanation
    category: READ
    cases:
      - id: system-test-defect-summary
        query: boardKey=system-test-defect-summary
  - method: GET
    path: /api/statistic-boards/{boardKey}/status
    category: READ
    ignore-paths:
      - "$.data.lastSyncedAt"
      - "$.data.lastRefreshStartedAt"
      - "$.data.lastRefreshFinishedAt"
    cases:
      - id: system-test-defect-summary
        query: boardKey=system-test-defect-summary
  - method: GET
    path: /api/statistic-boards/{boardKey}/export
    category: EXPORT
    response: excel
    cases:
      - id: system-test-defect-summary
        query: boardKey=system-test-defect-summary
      - id: system-test-defect-cause
        query: boardKey=system-test-defect-cause
      - id: system-test-delay-analysis
        query: boardKey=system-test-delay-analysis
      - id: customer-issue-defect-summary
        query: boardKey=customer-issue-defect-summary
      - id: customer-issue-defect-cause
        query: boardKey=customer-issue-defect-cause
      - id: customer-issue-delay-issues
        query: boardKey=customer-issue-delay-issues
      - id: customer-issue-by-function
        query: boardKey=customer-issue-by-function
      - id: customer-issue-response-efficiency
        query: boardKey=customer-issue-response-efficiency
      # mirror-table-overview 未登记在 PagePermissionKeyResolver.BOARD_EXPORT（任何环境确定性 400
      # "统计导出权限未定义"），无导出数据产出，不构成数据基线用例。
  - method: GET
    path: /api/statistic-boards/{boardKey}/horizontal-comparison/export
    category: EXPORT
    response: excel
    cases:
      - id: system-test-defect-summary
        query: boardKey=system-test-defect-summary
  - method: GET
    path: /api/statistic-boards/{boardKey}/issues/export
    category: EXPORT
    response: excel
    cases:
      - id: system-test-defect-summary
        query: boardKey=system-test-defect-summary
      - id: customer-issue-defect-summary
        query: boardKey=customer-issue-defect-summary
  - method: POST
    path: /api/statistic-boards/{boardKey}/refresh
    category: EXCLUDED
    exclude-reason: "async-trigger: Realtime 看板异步镜像刷新任务触发；镜像同步链路由 bootstrap 全链路同步自证"

