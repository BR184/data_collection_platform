    path: /api/dropdown-option-fields/{fieldKey}/preview
    category: READ
    cases:
      - id: form-project-name-empty-draft
        query: fieldKey=review-data.form.project-name
        body: '{"rules":{"acquiredRules":[],"manualRules":[]},"manualOptions":[]}'
  - method: PUT
    path: /api/dropdown-option-fields/{fieldKey}
    category: WRITE
    # 夹具库无配置：首存即建配置并绑定；configId 由序列分配，响应掩码忽略
    ignore-paths:
      - "$.body.data.configId"
    write-cases:
      - id: golden-save-initial-config
        query: fieldKey=review-data.form.project-name
        body: '{"rules":{"acquiredRules":[{"listType":"BLACKLIST","name":"golden黑名单","filterGroup":{"logic":"OR","conditions":[{"fieldKey":"optionValue","operator":"eq","value":"golden-blocked"}]}}],"manualRules":[]},"manualOptions":["golden-manual"],"version":0}'
        affected-tables:
          - table: dropdown_option_configs
            ignore-columns: [created_at, updated_at]
          - table: dropdown_option_field_bindings
            ignore-columns: [bound_at]
  - method: PUT
    path: /api/dropdown-option-fields/{fieldKey}/binding
    category: WRITE
    # 在上一写用例产生的绑定之上复制拆分；新 configId 由序列分配，响应掩码忽略
    ignore-paths:
      - "$.body.data.configId"
    write-cases:
      - id: golden-bind-copy
        query: fieldKey=review-data.form.project-name
        body: '{"target":"COPY"}'
        affected-tables:
          - table: dropdown_option_configs
            ignore-columns: [created_at, updated_at]
          - table: dropdown_option_field_bindings
            ignore-columns: [bound_at]

