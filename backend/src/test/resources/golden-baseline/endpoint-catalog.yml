  # =====GitlabSyncController（同步）=====
  - method: GET
    path: /api/gitlab-sync/configs
    category: READ
    # 配置行由全链路启动时种子写入（Testcontainers 端口逐次不同），时间戳/端口为运行状态
    ignore-paths:
      - "$.data[*].createdAt"
      - "$.data[*].updatedAt"
      - "$.data[*].dbPort"
      - "$.data[*].lastFullSyncAt"
    cases:
      - id: default
  - method: GET
    path: /api/gitlab-sync/status
    category: READ
    ignore-paths:
      - "$.data.config.createdAt"
      - "$.data.config.updatedAt"
      - "$.data.config.dbPort"
      - "$.data.config.lastFullSyncAt"
      - "$.data.logs[*].runId"
      - "$.data.logs[*].queuedAt"
      - "$.data.logs[*].startedAt"
      - "$.data.logs[*].finishedAt"
    cases:
      - id: by-config
        query: configId={{configId}}
  - method: GET
    path: /api/gitlab-sync/source-health
    category: READ
    # data 为数组；时间戳随每次链路运行刷新
    ignore-paths:
      - "$.data[*].currentStartedAt"
      - "$.data[*].latestLogFinishedAt"
      - "$.data[*].latestFactUpdatedAt"
    cases:
      - id: by-config
        query: configId={{configId}}
  - method: GET
    path: /api/gitlab-sync/table-sync-diagnostics
    category: READ
    # 逐表校验时间与连接池指标均为本次运行状态
    ignore-paths:
      - "$.data.generatedAt"
      - "$.data.directPoolMetrics"
      - "$.data.tables[*].lastAppliedAt"
      - "$.data.tables[*].lastVerifiedAt"
    cases:
      - id: by-config
        query: configId={{configId}}
  - method: GET
    path: /api/gitlab-sync/whitelist-options
    category: OPTIONS
    cases:
      - id: by-config
        query: configId={{configId}}
  - method: GET
    path: /api/gitlab-sync/system-hook-registration-status
    category: EXCLUDED
    exclude-reason: "external-dependency: 查询 GitLab Web API 的 hook 注册状态；golden 源库仅 JDBC 直连可达（15434），Web API 不可达"
  - method: POST
    path: /api/gitlab-sync/diagnostics
    category: READ
    cases:
      - id: default
  - method: POST
    path: /api/gitlab-sync/diagnostics/by-config
    category: READ
    cases:
      - id: by-config
        query: configId={{configId}}
  - method: PUT
    path: /api/gitlab-sync/config
    category: WRITE
    # 更新现有 golden-baseline 配置行（uk_source_instance 唯一约束禁止新建）；dbPort 为运行期容器映射端口
    ignore-paths:
      - "$.body.data.dbPort"
      - "$.body.data.createdAt"
      - "$.body.data.updatedAt"
      - "$.body.data.lastFullSyncAt"
      - "$.body.data.lastIncrementalSyncAt"
    write-cases:
      - id: golden-update
        body: '{"id":{{configId}},"name":"golden-baseline","enabled":true,"sourceEnabled":true,"autoSyncEnabled":false,"systemHookEnabled":false,"sourceInstance":null,"webBaseUrl":null,"apiToken":null,"delayLabelWritebackEnabled":false,"matchModeEnabled":false,"sourceMode":"DIRECT","whitelistMode":"RECOMMENDED","whitelistTables":null,"dbHost":"{{sourceDbHost}}","dbPort":{{sourceDbPort}},"dbName":"gitlabhq_full_import_test","dbUsername":"gitlab","dbPassword":"secret","dockerContainerName":null,"systemHookSecret":null,"systemHookProjectId":null,"compensationIntervalMinutes":360,"fullCompensationEnabled":false,"fullCompensationTime":null,"syncThreadMode":"FIXED","syncThreadValue":3,"maxSyncThreads":4}'
        affected-tables:
          - table: gitlab_sync_configs
            ignore-columns: [db_port, created_at, updated_at, last_full_sync_at, last_incremental_sync_at]
  - method: POST
    path: /api/gitlab-sync/full-sync
    category: EXCLUDED
    exclude-reason: "async-trigger: 全量同步异步任务触发；bootstrap 已用 by-config 变体真实执行全链路同步"
  - method: POST
    path: /api/gitlab-sync/full-sync/by-config
    category: EXCLUDED
    exclude-reason: "async-trigger: 全量同步异步任务触发；bootstrap 步骤以该端点真实执行全链路同步（SUCCESS + ODS/事实行数断言自证）"
  - method: POST
    path: /api/gitlab-sync/incremental-sync
    category: EXCLUDED
    exclude-reason: "async-trigger: 增量同步异步任务触发；由 bootstrap 全链路同步自证"
  - method: POST
    path: /api/gitlab-sync/incremental-sync/by-config
    category: EXCLUDED
    exclude-reason: "async-trigger: 增量同步异步任务触发；由 bootstrap 全链路同步自证"
  - method: POST
    path: /api/gitlab-sync/full-compensation-sync
    category: EXCLUDED
    exclude-reason: "async-trigger: 全量补偿同步异步任务触发；由 bootstrap 全链路同步自证"
  - method: POST
    path: /api/gitlab-sync/full-compensation-sync/by-config
    category: EXCLUDED
    exclude-reason: "async-trigger: 全量补偿同步异步任务触发；由 bootstrap 全链路同步自证"
  - method: POST
    path: /api/gitlab-sync/retry-failed/by-config
    category: EXCLUDED
    exclude-reason: "async-trigger: 失败重试异步任务触发；golden 环境同步必 SUCCESS，无失败可重试"
  - method: POST
    path: /api/gitlab-sync/cancel
    category: EXCLUDED
    exclude-reason: "async-trigger: 运行取消端点；golden 环境无运行中任务可取消，非数据产出"
  - method: POST
    path: /api/gitlab-sync/cancel/by-config
    category: EXCLUDED
    exclude-reason: "async-trigger: 运行取消端点；golden 环境无运行中任务可取消，非数据产出"
  - method: POST
    path: /api/gitlab-sync/purge
    category: EXCLUDED
    exclude-reason: "destructive: 按范围清理镜像数据的破坏性操作，会销毁基线环境状态"
  - method: POST
    path: /api/gitlab-sync/register-system-hook
    category: EXCLUDED
    exclude-reason: "destructive: 向 GitLab 创建 System Hook，写外部系统状态"
  - method: POST
    path: /api/gitlab-sync/register-system-hook/by-config
    category: EXCLUDED
    exclude-reason: "destructive: 向 GitLab 创建 System Hook，写外部系统状态"
  - method: POST
    path: /api/gitlab-sync/system-hook
    category: EXCLUDED
    exclude-reason: "external-dependency: GitLab 系统回调接收器（X-Gitlab-Token 外部调用方），非平台主动数据产出"
  - method: POST
    path: /api/gitlab-sync/test-connection
    category: EXCLUDED
    exclude-reason: "external-dependency: 源库连接探测，响应依赖外部活体状态；由 diagnostics 用例覆盖同链路"
  - method: POST
    path: /api/gitlab-sync/test-connection/by-config
    category: EXCLUDED
    exclude-reason: "external-dependency: 源库连接探测，响应依赖外部活体状态；由 diagnostics 用例覆盖同链路"

  # =====DatabaseBrowserController（数据库浏览器）=====
  - method: GET
    path: /api/database-browser/tables
    category: READ
    ignore-paths: ["$.data[*].lastSyncTime"]
    cases:
      - id: default
  - method: GET
    path: /api/database-browser/rows
    category: READ
    # db_port 为 Testcontainers 映射端口（逐次不同）；last_full_sync_at 为本次链路时间
    ignore-paths:
      - "$.data.lastSyncTime"
      - "$.data.rows[*].created_at"
      - "$.data.rows[*].updated_at"
      - "$.data.rows[*].db_port"
      - "$.data.rows[*].last_full_sync_at"
    cases:
      - id: sync-configs-page1
        query: tableName=gitlab_sync_configs&page=1&size=20
  - method: POST
    path: /api/database-browser/refresh
    category: EXCLUDED
    exclude-reason: "async-trigger: 镜像表增量刷新任务触发；由 bootstrap 全链路同步自证"

  # =====CodeReviewMatchModeDbSettingsController（兼容模式设置）=====
  - method: GET
    path: /api/code-review/match-mode-db-settings
    category: READ
    ignore-paths:
      - "$.data.syncStartedAt"
      - "$.data.syncFinishedAt"
      - "$.data.updatedAt"
    cases:
      - id: default
  - method: PUT
    path: /api/code-review/match-mode-db-settings
    category: WRITE
    ignore-paths:
      - "$.body.data.syncStartedAt"
      - "$.body.data.syncFinishedAt"
      - "$.body.data.updatedAt"
    write-cases:
      - id: golden-update
        body: '{"enabled":false,"syncEnabled":false,"mysqlHost":"golden.invalid","mysqlPort":13306,"mysqlDatabase":"legacy_platform","dgmMysqlDatabase":"legacy_dgm","mysqlUsername":"golden","mysqlPassword":"golden","mysqlTableName":"code_review_match_mode","legacyApiBaseUrl":"http://golden.invalid:8080","dgmLegacyApiBaseUrl":"http://golden.invalid:8080","selectedTableNames":["code_review_match_mode"],"mysqlFetchSize":1000,"mongoUri":"mongodb://golden.invalid:27017","mongoDatabase":"legacy_platform","selectedMongoCollectionNames":["review_report"],"reviewReportCollectionName":"review_report","reviewProblemCollectionName":"review_problem","reviewDataReadMode":"DB","codeReviewReadMode":"DB"}'
        affected-tables:
          - table: code_review_match_mode_db_settings
            ignore-columns: [created_at, updated_at, sync_started_at, sync_finished_at]
  - method: POST
    path: /api/code-review/match-mode-db-settings/sync-now
    category: EXCLUDED
    exclude-reason: "external-dependency: 从外部 MySQL 活体全量拉取兼容表；该链路将被 replace-compatibility-mode 计划删除，物化结果已由平台种子冻结"
  - method: POST
    path: /api/code-review/match-mode-db-settings/mongo/sync-now
    category: EXCLUDED
    exclude-reason: "external-dependency: 从外部 Mongo 活体拉取；该链路将被 replace-compatibility-mode 计划删除，物化结果已由平台种子冻结"
  - method: POST
    path: /api/code-review/match-mode-db-settings/formal-import
    category: EXCLUDED
    exclude-reason: "external-dependency: 确认文本与乐观锁校验通过后即连接外部 MySQL 活体执行正式导入（种子配置 mysqlHost 非空），golden 禁止触碰外部系统且导入会改写正式事实归属"
  - method: POST
    path: /api/code-review/match-mode-db-settings/test-connection
    category: EXCLUDED
    exclude-reason: "external-dependency: 外部 MySQL 连接探测"
  - method: POST
    path: /api/code-review/match-mode-db-settings/table-options
    category: EXCLUDED
    exclude-reason: "external-dependency: 连接外部 MySQL 枚举库表；活体不在 golden 范围（兼容链路将删除）"
  - method: POST
    path: /api/code-review/match-mode-db-settings/mongo/test-connection
    category: EXCLUDED
    exclude-reason: "external-dependency: 外部 Mongo 连接探测"
  - method: POST
    path: /api/code-review/match-mode-db-settings/mongo/collection-options
    category: EXCLUDED
    exclude-reason: "external-dependency: 连接外部 Mongo 枚举集合；活体不在 golden 范围（兼容链路将删除）"
  - method: GET
    path: /api/code-review/match-mode-db-settings/dgm-gitlab-project-source
    category: READ
    ignore-paths:
      - "$.data.lastSyncStartedAt"
      - "$.data.lastSyncFinishedAt"
      - "$.data.updatedAt"
    cases:
      - id: default
  - method: PUT
    path: /api/code-review/match-mode-db-settings/dgm-gitlab-project-source
    category: WRITE
    ignore-paths:
      - "$.body.data.lastSyncStartedAt"
      - "$.body.data.lastSyncFinishedAt"
      - "$.body.data.updatedAt"
    write-cases:
      - id: golden-update
        body: '{"enabled":true,"gitlabBaseUrl":"http://golden.invalid","accessToken":"golden-token","groupPath":"golden-group","includeSubgroups":true,"includeArchived":false,"syncIntervalMinutes":60}'
        affected-tables:
          - table: code_review_dgm_gitlab_project_source_settings
            ignore-columns: [updated_at, last_sync_started_at, last_sync_finished_at]
  - method: POST
    path: /api/code-review/match-mode-db-settings/dgm-gitlab-project-source/test-connection
    category: EXCLUDED
    exclude-reason: "external-dependency: DGM GitLab 项目候选 API 连通性测试"
  - method: GET
    path: /api/code-review/match-mode-db-settings/dgm-gitlab-project-options
    category: READ
    cases:
      - id: default
  - method: POST
    path: /api/code-review/match-mode-db-settings/dgm-gitlab-project-options/sync-now
    category: EXCLUDED
    exclude-reason: "external-dependency: DGM 项目下拉缓存刷新依赖 GitLab Web API"

  # =====ExternalDatasetController（外部数据集 API）=====
  - method: GET
    path: /api/external/v1/datasets
    category: EXCLUDED
