    path: /api/label-groups/dimensions/{dimensionKey}/values
    category: READ
    cases:
      - id: module-page1
        query: dimensionKey=module&page=1&size=20
  - method: GET
    path: /api/label-groups/dimensions/{dimensionKey}/compatible-pages
    category: READ
    cases:
      - id: module
        query: dimensionKey=module
  - method: GET
    path: /api/label-groups/dynamic-rule-sources
    category: READ
    ignore-paths: ["$.data[*].createdAt", "$.data[*].updatedAt"]
    cases:
      - id: default
  - method: GET
    path: /api/label-groups/dynamic-rule-relations
    category: READ
    cases:
      - id: default
  - method: GET
    path: /api/label-groups/dynamic-rule-sources/{sourceKey}/fields/{fieldKey}/candidates
    category: READ
    cases:
      - id: issue-fact-project-name
        query: sourceKey=issue_fact&fieldKey=projectId
  - method: POST
    path: /api/label-groups
    category: WRITE
    ignore-paths:
      - "$.body.data.createdAt"
      - "$.body.data.updatedAt"
    write-cases:
      - id: golden-create
        body: '{"name":"golden-标签组","groupType":"STATIC","applicableScope":"SAME_TYPE","description":"golden 写用例","members":[{"value":"golden-member","label":"golden成员"}],"childGroupIds":[]}'
        affected-tables:
          - table: label_groups
            ignore-columns: [created_at, updated_at]
          - table: label_group_members
            ignore-columns: [created_at, updated_at]
  - method: PUT
    path: /api/label-groups/{groupId}
    category: WRITE
    ignore-paths:
      - "$.body.data.createdAt"
      - "$.body.data.updatedAt"
    # 系统默认组（迁移播种）：名称/适用范围被锁定，成员整体替换为固定值
    write-cases:
      - id: golden-update
        query: groupId={{groupId}}
        body: '{"groupType":"STATIC","description":"golden 更新描述","enabled":true,"members":[{"value":"golden-member","label":"golden成员"}],"childGroupIds":[]}'
        affected-tables:
          - table: label_groups
            ignore-columns: [created_at, updated_at]
          - table: label_group_members
            ignore-columns: [created_at, updated_at]
  - method: DELETE
    path: /api/label-groups/{groupId}
    category: WRITE
    # 最小 id 组是迁移播种的系统默认组：删除被拒（确定性 400 契约，校验前置不改表）
    write-cases:
      - id: default-group-denied
        query: groupId={{groupId}}
        affected-tables:
          - table: label_groups
            ignore-columns: [created_at, updated_at]
          - table: label_group_members
            ignore-columns: [created_at, updated_at]
