    ignore-paths: ["$.data.records[*].retentionHours"]
    cases:
      - id: delay-default
        query: topic=delay
      - id: cc-product-default
        query: topic=cc-product
      - id: delay-page1
        query: topic=delay&page=1&size=20
  - method: GET
