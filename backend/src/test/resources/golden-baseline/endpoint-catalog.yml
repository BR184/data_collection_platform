    category: READ
    cases:
      - id: default
  - method: GET
    path: /api/dropdown-option-fields/{fieldKey}
    category: READ
    cases:
      - id: form-project-name
        query: fieldKey=review-data.form.project-name
  - method: GET
    path: /api/dropdown-option-fields/{fieldKey}/acquired-options
