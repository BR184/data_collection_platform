    path: /api/label-groups/{groupId}/expand
    category: EXCLUDED
    exclude-reason: "empty-runtime-config: label_group_members 为运行期配置数据且无迁移种子（golden 库恒为空），展开端点确定性 400（该标签组当前没有可用成员）；成员生成后的展开行为由写用例阶段评估覆盖"
