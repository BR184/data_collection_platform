          - table: issue_fact_customer_members
            scope: "source_instance = '{{issueKeySource}}' and project_id = {{issueKeyProjectId}} and issue_id = {{issueKeyDbId}}"
            ignore-columns: [created_at, updated_at]
          - table: issue_scope_groups
            ignore-columns: [created_at, updated_at]
          - table: issue_scope_members
            ignore-columns: [created_at, updated_at]

