  - method: GET
    path: /api/external/v1/datasets/{datasetKey}
    category: EXCLUDED
    exclude-reason: "external-dependency: 外部数据集 API 默认关闭（platform.external-api.enabled=false），且 generatedAt 每次必变；由独立安全链路（机器 Token）覆盖"
