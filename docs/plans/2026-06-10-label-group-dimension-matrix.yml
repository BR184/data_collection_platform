schemaVersion: 1
description: 平台标签组可应用字段与页面兼容矩阵。设计入口见 docs/plans/2026-06-10-label-group-value-set-design.md；dimensions/dimensionKey 为历史字段目录命名，不表示标签组成员维度；标签组 valueType 由首个有效成员或动态规则输出推断，用户不手动声明。

dimensions:
  - key: module
    name: 模块
    valueKind: STRING_LITERAL
    source: 事实层归一化模块字段，遵守老平台模块识别规则
    mvpSupported: true
    notes: 工具箱归并到模块；组合值按现有筛选规则拆分后去重
  - key: project
    name: 项目
    valueKind: STRING_LITERAL
    source: 事实层项目名称字段
    mvpSupported: true
    notes: 字段候选来自现有项目筛选字段；静态字符串标签组仍允许用户手动输入成员值
  - key: review_owner
    name: 评审负责人
    valueKind: STRING_LITERAL
    source: 评审数据 reviewOwner 文本字段
    mvpSupported: true
    notes: 字段值类型为字符串；标签组成员只保存字符串值本身，不按评审负责人身份保存
  - key: review_expert
    name: 评审专家
    valueKind: STRING_LITERAL
    source: 评审数据 reviewExpert/reviewExpertsSummary 多值字段
    mvpSupported: true
    notes: 多值字段按成员集合相交匹配，复用 ReviewDataRecordFilterGroupSupport.splitMultiValue 同款拆分逻辑
  - key: issue_assignee
    name: 议题处理人
    valueKind: STRING_LITERAL
    source: 议题事实层 assigneeName 文本字段
    mvpSupported: true
    notes: 字段值类型为字符串；标签组成员只保存字符串值本身，不按议题处理人身份保存
  - key: customer_assignee
    name: 客户问题处理人
    valueKind: STRING_LITERAL
    source: 客户问题事实层 assigneeName 文本字段
    mvpSupported: true
    notes: 字段值类型为字符串；标签组成员只保存字符串值本身；第一版不接入客户问题负责人字段
  - key: target_branch
    name: 目标分支
    valueKind: BRANCH_NAME
    source: 合并请求事实层目标分支字段
    mvpSupported: false
    notes: 第一版不接入业务页面，后续代码走查或合并请求页面确认后启用
  - key: milestone
    name: 里程碑
    valueKind: STRING_LITERAL
    source: 议题事实层 milestoneTitle 字段
    mvpSupported: true
    notes: 未被老平台或事实层识别为里程碑的文本不得进入候选
  - key: round
    name: 轮次
    valueKind: STRING_LITERAL
    source: 系统测试阶段定义或事实层轮次字段
    mvpSupported: false
    notes: 第一版先不作为独立维度；若页面只有测试阶段字段，不反推新轮次维度
  - key: test_stage
    name: 测试阶段
    valueKind: STRING_LITERAL
    source: 议题事实层 testingPhase 字段
    mvpSupported: true
    notes: 只使用老平台规则识别出的测试阶段关键字
  - key: severity_level
    name: 严重程度
    valueKind: ENUM_KEY
    source: 事实层严重程度枚举
    mvpSupported: true
    notes: 固定为一级缺陷、二级缺陷、三级缺陷，不与紧急程度混用
  - key: priority_level
    name: 紧急程度
    valueKind: ENUM_KEY
    source: 事实层 priorityLevel 字段
    mvpSupported: true
    notes: 固定为 P1、P2、P3，不与严重程度混用
  - key: defect_reason
    name: 缺陷原因
    valueKind: ENUM_KEY
    source: 规则层缺陷原因枚举
    mvpSupported: false
    notes: 第一版不接入记录页；统计板接入前需确认具体看板字段
  - key: delay_reason
    name: 延期原因
    valueKind: ENUM_KEY
    source: 规则层延期原因枚举
    mvpSupported: false
    notes: 第一版不接入记录页；仅允许规则层已确认的延期原因类型
  - key: closure_status
    name: 客户问题闭环状态
    valueKind: ENUM_KEY
    source: 客户问题事实层闭环状态/缺陷状态字段
    mvpSupported: true
    canonicalValues:
      - 需求如此
    equivalentValues:
      需求如此:
        - 需求如此
        - 设计如此
    notes: 候选只展示并保存需求如此，展开匹配需求如此和设计如此

pages:
  - pageKey: review-data-home
    name: 评审数据管理
    module: 评审数据
    mvpEnabled: true
    sourceParameter: sourceInstance
    dimensions:
      - dimensionKey: project
        fieldKey: projectName
        requestField: ReviewDataRecordQueryRequest.projectName
      - dimensionKey: module
        fieldKey: moduleName
        requestField: ReviewDataRecordQueryRequest.moduleName
      - dimensionKey: review_owner
        fieldKey: reviewOwner
        requestField: ReviewDataRecordQueryRequest.reviewOwner
      - dimensionKey: review_expert
        fieldKey: reviewExpert
        requestField: ReviewDataRecordQueryRequest.reviewExpert
        matchMode: ANY_INTERSECT
  - pageKey: question-metrics-issue-search
    name: 系统测试议题查询
    module: 系统测试
    mvpEnabled: true
    sourceParameter: sourceInstance
    dimensions:
      - dimensionKey: project
        fieldKey: projectName
        requestField: SystemTestIssueSearchQueryRequest.projectName
      - dimensionKey: module
        fieldKey: moduleName
        requestField: SystemTestIssueSearchQueryRequest.moduleName
      - dimensionKey: test_stage
        fieldKey: testingPhase
        requestField: SystemTestIssueSearchQueryRequest.testingPhase
      - dimensionKey: severity_level
        fieldKey: severityLevel
        requestField: SystemTestIssueSearchQueryRequest.severityLevel
      - dimensionKey: priority_level
        fieldKey: priorityLevel
        requestField: SystemTestIssueSearchQueryRequest.priorityLevel
      - dimensionKey: milestone
        fieldKey: milestoneTitle
        requestField: SystemTestIssueSearchQueryRequest.milestoneTitle
      - dimensionKey: issue_assignee
        fieldKey: assigneeName
        requestField: SystemTestIssueSearchQueryRequest.assigneeName
  - pageKey: customer-issues-cc-product-issues
    name: 客户问题列表
    module: 客户问题
    mvpEnabled: true
    sourceParameter: sourceInstance
    dimensions:
      - dimensionKey: module
        fieldKey: moduleName
        requestField: IssueFactRecordPageQuery.moduleName
      - dimensionKey: customer_assignee
        fieldKey: assigneeName
        requestField: IssueFactRecordPageQuery.assigneeName
        notes: Phase 5 需补客户问题页面处理人候选入口
      - dimensionKey: priority_level
        fieldKey: priorityLevel
        requestField: IssueFactRecordPageQuery.priorityLevel
      - dimensionKey: milestone
        fieldKey: milestoneTitle
        requestField: IssueFactRecordPageQuery.milestoneTitle
      - dimensionKey: closure_status
        fieldKey: bugStatus
        requestField: IssueFactRecordPageQuery.bugStatus
        expansion: EQUIVALENT_VALUES
  - pageKey: statistic-board-*
    name: 统计板高级筛选
    module: 统计看板
    mvpEnabled: false
    dimensions: []
    notes: 取决于看板 definition.filters，Phase 6 逐看板验证

disallowedFields:
  - field: 有效的独立评审问题数合计
    reason: 指标，不是标签值
  - field: 独立评审工作量合计
    reason: 指标，不是标签值
  - field: 缺陷密度
    reason: 计算结果，不是标签值
  - field: 占比
    reason: 计算结果，不是标签值
  - field: 质量看板模块
    reason: 页面结构名称，不是事实字段
  - field: 指标与例外条件
    reason: 页面说明文本，不是事实字段
